services:
  - type: web
    name: clipforge-ai-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: CLIPFORGE_REQUIRE_ACCESS_KEY
        value: "1"
      - key: CLIPFORGE_ACCESS_KEY
        generateValue: true
      - key: CLIPFORGE_DATA
        value: /app/data
      - key: MAX_UPLOAD_MB
        value: "200"
      - key: MAX_DURATION_SECONDS
        value: "1800"
      - key: WHISPER_MODEL
        value: tiny
      - key: CORS_ORIGINS
        value: "https://localhost,http://localhost"
